# Two services on the project's own network: a web server that answers on this computer, and a
# cache that publishes nothing, reached from the network only. No build, no bind mount: two
# public images.
services:
  web:
    image: busybox:1.36
    # An init process passes on the stop signal, so `park` stops the server at once.
    init: true
    command: ["sh", "-c", "mkdir -p /www && echo 'hello from web' > /www/index.html && exec httpd -f -p 80 -h /www"]
    # Published on this computer's loopback, at a port Docker picks and Isothrum keeps.
    ports: ["127.0.0.1::80"]
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      retries: 15

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
