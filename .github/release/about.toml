# cargo-about: the licences of every crate `isothrum` is built from, shipped in each release
# archive as THIRD-PARTY-LICENSES.md (release.yml renders about.hbs, beside this file). The
# accepted licences are deny.toml's, kept equal by xtask's `licences` guardrail.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
