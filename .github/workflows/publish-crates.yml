name: Publish crates

# Publishes the Isothrum library crates to crates.io with crates.io Trusted Publishing: the job
# mints a short-lived token over OIDC at run time (no long-lived secret is stored). Triggered by a
# release tag `vX.Y.Z` or run by hand from the Actions tab. It publishes in dependency order and
# skips any crate whose version is already on crates.io, so re-running after a partial failure is
# safe.
#
# Setup (per crate, done once by the maintainer): add a Trusted Publisher on crates.io for the
# crate, pointing at repository `Isothrum/isothrum`, this workflow file (`publish-crates.yml`) and
# the `crates-io` environment. A brand-new crate name must be created by one manual `cargo publish`
# first (trusted publishing cannot create a crate that does not exist). The Isoloom crates this
# release depends on must already be on crates.io at the requested version (publish isoloom first).
# See PUBLISHING.md. Keep this file's name: the Trusted Publishers name it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests and the quality ratchet must pass before anything is published: without this an
  # untested runner could reach crates.io and propagate into its consumers.
  gate:
    uses: ./.github/workflows/gate.yml

  publish:
    needs: gate
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      # Required for crates.io Trusted Publishing (OIDC); no CARGO_REGISTRY_TOKEN secret is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins (the one the gate tested), not whatever is stable.
      - run: rustup toolchain install --profile minimal

      # Mints a short-lived crates.io token over OIDC and exports it for the publish step.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # On a tag, the tag must name the workspace version (as release.yml checks), so a tag
      # can't publish crates at a version it doesn't name.
      - name: The tag is the workspace version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "isothrum-cli") | .version')"
          if [ "${REF_TYPE}" = tag ] && [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} isn't the workspace version (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Leaf crates first: each crate's dependencies are published before it.
          crates=(isothrum-compiler isothrum-runner isothrum-machine isothrum-wasm isothrum-cli)
          version="${VERSION}"
          echo "Publishing Isothrum crates at version ${version}"
          for crate in "${crates[@]}"; do
            if curl -sf -A "isothrum-publish-workflow" \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "::notice::${crate} ${version} is already on crates.io, skipping"
              continue
            fi
            echo "::group::Publishing ${crate} ${version}"
            cargo publish -p "${crate}"
            echo "::endgroup::"
          done
