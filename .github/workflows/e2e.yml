name: E2E on hosted runners

# isothrum-machine's machine tier (`cargo xtask e2e --tier machine`) on GitHub's own runners: each
# is a clean machine, thrown away after the job, so the installs run for real as a setup runs them
# (`ISOTHRUM_E2E_INSTALL`), then the tests on what they installed. A test whose tool isn't there
# skips, saying why; the job fails only when a test fails.
#
# What a hosted runner can test:
# - Linux (x86_64, KVM): the installs of Vagrant, Terraform, QEMU, libvirt and their Vagrant
#   plugins, Docker Engine, and real VMs: the libvirt and QEMU self-tests and examples boot them.
# - macOS (arm64, no nested virtualization): the installs from Homebrew and the providers'
#   detection; no VM boots, no Docker and no GUI session.
# - Windows: the installs of Vagrant and Terraform, the tool path and the terminal; no Hyper-V VM
#   or WSL 2 (nested virtualization), so nothing that needs a restart, and no Linux containers
#   (its Docker Engine runs Windows ones).
# What a runner can't run is left out by name (`--leave-out`) and recorded as a skip.
# VMware, Parallels, Hyper-V, UTM, VirtualBox, Docker Desktop and arm64 Linux stay on our own
# machines (`./ws test`): their licences, their nested virtualization or their CPU.
#
# Before main and a release (gate.yml calls it), by hand, and on a pull request into dev that
# changes these tests or this workflow: a run takes 15-30 minutes, too long for every pull request.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/e2e.yml
      - xtask/src/e2e.rs
      - crates/isothrum-machine/tests/real/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  machine:
    name: Machine tier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `leave_out`: what the runner can't run, recorded as a skip that says so.
          - os: ubuntu-24.04
            install: vagrant,terraform,qemu,libvirt,vagrant-libvirt,vagrant-qemu
            leave_out: ""
          # macOS: no nested virtualization (QEMU's HVF answers HV_UNSUPPORTED), no GUI session
          # for osascript, and egress through more than one address.
          - os: macos-15
            install: vagrant,terraform,qemu,vagrant-qemu
            leave_out: >-
              selftest::the_hypervisor_self_test_boots_a_vm_on_qemu
              run::the_vagrant_example_runs_on_qemu
              terminal::a_command_opens_in_this_computers_terminal
              net::the_public_address_is_one_the_services_agree_on
          # Windows Server: Hyper-V is there, but with no virtual switch and no nested
          # virtualization to boot a VM; its Docker Engine runs Windows containers only (no
          # manifest of the Linux images for windows/amd64).
          - os: windows-2025
            install: vagrant,terraform
            leave_out: >-
              selftest::the_hypervisor_self_test_boots_a_vm_on_hyperv
              run::the_vagrant_example_runs_on_hyperv
              selftest::the_engine_self_test_passes_on_this_computers_engine
              run::the_compose_example_runs_here
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ISOTHRUM_E2E_INSTALL: ${{ matrix.install }}
      LEAVE_OUT: ${{ matrix.leave_out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: The machine tier
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          RESULTS="$RUNNER_TEMP/e2e/results.jsonl"
          args=(--tier machine --results "$RESULTS")
          for case in $LEAVE_OUT; do args+=(--leave-out "$case"); done
          set +e
          cargo run -q -p xtask --locked -- e2e "${args[@]}"
          code=$?
          if [ "$code" = 76 ]; then
            # The installs joined this account to groups (libvirt, kvm, docker) that apply from
            # its next login: sudo, to the same account, reads its groups afresh as a login does.
            sudo --preserve-env -u "$(id -un)" env PATH="$PATH" \
              cargo run -q -p xtask --locked -- e2e "${args[@]}"
            code=$?
          fi
          exit "$code"
      - name: Summary
        if: always()
        shell: bash
        run: |
          RESULTS="$RUNNER_TEMP/e2e/results.jsonl"
          [ -f "$RESULTS" ] || exit 0
          {
            echo "### Machine tier on ${{ matrix.os }}"
            echo
            jq -rs 'group_by(.result) | map("- \(.[0].result): \(length)") | .[]' "$RESULTS"
            echo
            echo "| test | result | seconds | reason |"
            echo "|---|---|---|---|"
            jq -r '"| \(.case) | \(.result) | \(.seconds // "") | \((.reason // "") | gsub("[|\n]"; " ") | .[0:160]) |"' "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-machine-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
