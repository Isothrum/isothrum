name: Release

# The release binaries of `isothrum`, on a tag `vX.Y.Z`: after the release gate (gate.yml), one
# archive per platform, a CycloneDX SBOM, SHA256SUMS over them, a keyless Sigstore signature of
# SHA256SUMS (cosign, the identity being this workflow at the tag), a build provenance attestation
# of every file, and a GitHub release whose notes are the CHANGELOG's section for the version.
# docs/how-to/verify-a-release.md says how to check a download. The crates go to crates.io from
# publish-crates.yml, on the same tag.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read

  # The tag must name the workspace version, and the CHANGELOG must have its section.
  plan:
    needs: gate
    name: Version and release notes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - name: The tag is the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "isothrum-cli") | .version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} isn't the workspace version (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Everything under `## [X.Y.Z]` up to the next `## [` heading.
          awk -v head="## [${VERSION}]" '
            /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
      # The licence of every crate the binary is built from, shipped in each archive.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licences
        run: |
          cargo about generate --locked -c .github/release/about.toml \
            --manifest-path crates/isothrum-cli/Cargo.toml \
            .github/release/about.hbs -o THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  build:
    needs: plan
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's toolchain, plus the target. No cache: a release builds from scratch.
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p isothrum-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
      # isothrum-<version>-<target>/ with the binary, the licences, NOTICE and the README:
      # a .tar.gz, or a .zip on Windows (the names cargo-binstall reads from the CLI's Cargo.toml).
      - name: Package
        run: |
          set -euo pipefail
          name="isothrum-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${TARGET}/release/isothrum${ext}" "dist/${name}/"
          cp LICENSE NOTICE README.md THIRD-PARTY-LICENSES.md "dist/${name}/"
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: plan
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      # The CLI's dependency tree on every platform (`--target all`), from Cargo.lock. The tool
      # writes one file per workspace member; the release keeps the CLI's.
      - name: SBOM of isothrum-cli
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/isothrum-cli/Cargo.toml --format json \
            --spec-version 1.5 --target all --override-filename "isothrum-${VERSION}.cdx"
          mkdir -p dist
          mv "crates/isothrum-cli/isothrum-${VERSION}.cdx.json" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build, sbom]
    name: Sign, attest and publish the release
    runs-on: ubuntu-24.04
    # Approval and tag rules for publishing a release can be set on this environment.
    environment: release
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Keyless signing (Sigstore) and the provenance attestations take an OIDC token.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # A keyless signature: the certificate names this workflow at the tag, recorded in Rekor.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "isothrum ${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
