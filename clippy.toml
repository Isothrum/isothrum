# Shape limits: functions at most 60 lines, at most 5 parameters, cognitive complexity 15.
too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 5

# Tests may unwrap, expect, panic, print and index: a failing test is the report.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = false
allow-indexing-slicing-in-tests = true

# Product names written as their makers write them, not code (`doc_markdown` would want them in
# backticks): Isoloom's list, the same words in every repository; `..` keeps clippy's own list.
doc-valid-idents = [
    "AlmaLinux", "BitLocker", "CentOS", "ConfigMap", "CSR1000v", "DigitalOcean", "ESXi", "HashiCorp",
    "ICMPv6", "IOSv", "IOSvL2", "NetBIOS", "NetworkManager", "NitroTPM", "NVMe", "OpenRC", "OpenTofu",
    "OrbStack", "PCIe", "SeaBIOS", "SELinux", "StefanScherer", "VirtIO", "VirtualBox", "VMware", "VNet",
    "WinFsp", "WinNAT", "WinRM", "..",
]

# A process starts in an adapter only: the runner's process module (`ProcessRunner`, which every
# tool call goes through, so it is recorded, grouped, timed and killable) and the few modules
# that drive a tool of their own. Each such site carries `#[expect(clippy::disallowed_methods,
# reason = "…")]` naming why it can't go through the process module; tests and the xtask, which
# start tools to stand in for them or to drive them, say so once at their crate's root.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "a process starts through the runner's process module (`ProcessRunner`): an adapter that can't says why with an #[expect]" },
    { path = "tokio::process::Command::new", reason = "a process starts through the runner's process module (`ProcessRunner`): an adapter that can't says why with an #[expect]" },
    { path = "process_wrap::tokio::CommandWrap::with_new", reason = "a process starts through the runner's process module (`ProcessRunner`): an adapter that can't says why with an #[expect]" },
]
