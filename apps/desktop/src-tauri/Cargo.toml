[package]
name = "isothrum-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace: GTK/WebKit are needed here only.
[workspace]

[lib]
name = "isothrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Isoloom at the commit the libraries pin (the root Cargo.toml): the spec the editor's compiler
# writes, the lab it lowers to and the files each target generates.
isoloom-spec = { git = "https://github.com/isoloom/isoloom", rev = "690d585efdff4f5b9c78f2af65383b807d0a654a" }
isoloom-targets = { git = "https://github.com/isoloom/isoloom", rev = "690d585efdff4f5b9c78f2af65383b807d0a654a" }
tauri-plugin-updater = "2"
# The machine-setup domain (the same backend the Cyber CTF launcher uses) and the runner whose
# `SystemProcesses` drives its tools. Path deps on the workspace crates this app is excluded from.
isothrum-machine = { path = "../../../crates/isothrum-machine" }
isothrum-runner = { path = "../../../crates/isothrum-runner" }

[dev-dependencies]
# The tests run what the editor's compiler writes.
isothrum-compiler = { path = "../../../crates/isothrum-compiler" }

# This crate is excluded from the isothrum workspace (it needs GTK/WebKit), so the workspace's
# `[workspace.lints]` never reach it. It carries its own copy of that standard instead, a lone
# `[lints]` table because this is a single-package workspace. One deliberate difference: the
# workspace forbids unsafe, this crate denies it, so the one audited `set_var` on start-up
# (src/tools.rs) can carry a documented `#[expect(unsafe_code, reason = …)]`; `forbid` could not
# be lifted that way. Every other lint matches the workspace at `deny`.
[lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "deny"
similar_names = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
wildcard_imports = "deny"
shadow_unrelated = "deny"
let_underscore_must_use = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
get_unwrap = "deny"
