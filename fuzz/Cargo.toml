# The fuzz targets (cargo-fuzz), run by `cargo run -p xtask -- fuzz`. A workspace of its
# own: they build with nightly and libFuzzer, which the main workspace's gates (stable, three
# platforms) don't. Each crash a run finds becomes a regression test in the crate it belongs to.
[package]
name = "isothrum-fuzz"
description = "Isothrum's fuzz targets: the compiler's drawing parser, the runner's placeholder filling and step planning."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# The inputs each target starts from (folders, relative to this one), besides its own corpus:
# the fixtures, and the inputs a run once found a crash with (`seeds/<target>`).
[package.metadata.seeds]
drawing = ["../crates/isothrum-compiler/tests/fixtures", "seeds/drawing"]
placeholders = []
plan = ["../crates/isothrum-runner/tests/fixtures"]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
isothrum-compiler = { path = "../crates/isothrum-compiler" }
isothrum-runner = { path = "../crates/isothrum-runner", features = ["fuzzing"] }
# The names Isoloom reads a spec from (`SPEC_FILES`), for the drawing target's oracle: the
# compiler's version.
isoloom-spec = "1.0.9"
serde_json = "1"

# The workspace's lint set, copied: a crate outside the workspace can't inherit it. Kept the same
# as the root `Cargo.toml`'s, but for `clippy::panic`: a fuzz target's verdict is a panic.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "deny"
similar_names = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
wildcard_imports = "deny"
shadow_unrelated = "deny"
let_underscore_must_use = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
get_unwrap = "deny"

[[bin]]
name = "drawing"
path = "fuzz_targets/drawing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "placeholders"
path = "fuzz_targets/placeholders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan"
path = "fuzz_targets/plan.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
