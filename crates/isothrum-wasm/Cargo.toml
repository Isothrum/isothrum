[package]
name = "isothrum-wasm"
description = "The editor's engine in WebAssembly: a drawn network becomes an Isoloom spec, every target's files and the downloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isothrum-wasm"
readme = "README.md"
keywords = ["isothrum", "isoloom", "wasm", "network", "topology"]
categories = ["wasm", "network-programming"]
exclude = ["tests/"]
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
isoloom-plan.workspace = true
isoloom-spec.workspace = true
isoloom-targets.workspace = true
isothrum-compiler.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
zip.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
