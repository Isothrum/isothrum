[package]
name = "isothrum-runner"
description = "The Isothrum runner: runs a Compose project, a Vagrantfile or a Terraform module through its own tool (lifecycle, state and locks, the format drivers, events)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isothrum-runner"
readme = "README.md"
keywords = ["isothrum", "runner", "infrastructure", "environment"]
categories = ["virtualization", "development-tools"]
publish = true

[features]
# The test doubles (scripted processes, scripted host ports), for embedders' tests.
fake = []

[dependencies]
indexmap = { workspace = true }
flate2.workspace = true
# The random token of an elevated session (`process/elevated.rs`).
getrandom.workspace = true
process-wrap.workspace = true
regex.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
socket2.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
isothrum-test-support.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# What a test reads of the runner's traces (`testing::traced`).
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
