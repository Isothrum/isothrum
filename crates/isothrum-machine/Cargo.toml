# The machine-setup domain: which Vagrant providers (hypervisors) this computer can drive, and the
# record format of what a program downloaded for its own operations, on the Isothrum runner's
# no-unsafe `ProcessRunner`.
[package]
name = "isothrum-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Machine-setup domain for Isothrum: detect the Vagrant providers (hypervisors) this computer can drive, and read the record of the images and boxes a program downloaded."
documentation = "https://docs.rs/isothrum-machine"
keywords = ["isothrum", "vagrant", "hypervisor", "virtualization"]
categories = ["virtualization", "development-tools"]
exclude = ["rustfmt.toml"]
publish = true

[lints]
workspace = true

[dependencies]
isoloom-manifest.workspace = true
isothrum-runner.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
isothrum-runner = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
