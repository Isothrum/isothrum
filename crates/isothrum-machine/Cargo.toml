# The machine-setup domain: which Vagrant providers (hypervisors) this computer can drive, on the
# Isothrum runner's no-unsafe `ProcessRunner`.
[package]
name = "isothrum-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Machine-setup domain for Isothrum: detect the Vagrant providers (hypervisors) this computer can drive."
documentation = "https://docs.rs/isothrum-machine"
readme = "README.md"
keywords = ["isothrum", "vagrant", "hypervisor", "virtualization"]
categories = ["virtualization", "development-tools"]
exclude = ["rustfmt.toml"]
publish = true

[lints]
workspace = true

[dependencies]
isoloom-manifest.workspace = true
isothrum-runner.workspace = true
tokio.workspace = true

[dev-dependencies]
isothrum-runner = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[package.metadata.docs.rs]
all-features = true
