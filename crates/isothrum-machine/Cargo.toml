# The machine-setup domain: which Vagrant providers (hypervisors) this computer can drive, on the
# Isothrum runner's no-unsafe `ProcessRunner`.
[package]
name = "isothrum-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Machine-setup domain for Isothrum: check this computer's tools, Docker engines and WSL 2, and detect the Vagrant providers (hypervisors) it can drive."
documentation = "https://docs.rs/isothrum-machine"
readme = "README.md"
keywords = ["isothrum", "vagrant", "docker", "hypervisor", "virtualization"]
categories = ["virtualization", "development-tools"]
publish = true

[lints]
workspace = true

[features]
# The TypeScript types of a provider's status and reasons, for a UI in TypeScript.
ts-rs = ["dep:ts-rs", "isothrum-runner/ts-rs"]

[dependencies]
isothrum-runner.workspace = true
# A Proxmox VE server's API (`place/proxmox.rs`), its certificate trusted as the runner's `tls` says.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The SHA-256 fingerprints of a server's SSH host keys (`place/ssh/known_hosts.rs`).
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# The TypeScript types are derived in tests too, so their shape is tested whatever the features.
isothrum-runner = { workspace = true, features = ["fake", "ts-rs"] }
ts-rs.workspace = true
isothrum-test-support.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[package.metadata.docs.rs]
all-features = true
